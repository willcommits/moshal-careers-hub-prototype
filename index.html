<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moshal Careers Hub</title>
<style>
/*
 * Brand, from Branding/. The palette has one structural family and three status colours, nothing else:
 *   Structure (Moshal Program blue family): navy #16385C for the sidebar and headings, blue #2362B4 for anything you can
 *     click or that is selected, a light-blue tint for selected and hover surfaces. On the navy sidebar the selected mark is
 *     the Scholars light blue #41C3FF, the same family one step lighter so it shows on dark.
 *   Status, only when something has a state: Alumni amber #EBB22A = needs your attention (closing soon, flagged, unread);
 *     Dreamers green #79BE4D = done or live (applied, published, read); Leaders red #E15546 = broken or destructive.
 *   Everything else is neutral: white cards, one hairline, slate text.
 *   The four sub-brands are also audiences, and appear as the stages of one journey (Dreamers, Scholars, Alumni, Leaders):
 *     the strip on the sign-in hero, the colour of each person's avatar, a four-dot chip beside the dashboard greeting, and the champion's card.
 * Type is Narkiss Block, Regular and Medium only.
 */
@font-face{font-family:"Narkiss Block";src:url("brand/NarkissBlock-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Narkiss Block";src:url("brand/NarkissBlock-Medium.otf") format("opentype");font-weight:500 700;font-display:swap}
@font-face{font-family:"Frank Ruhl Libre";src:url("brand/FrankRuhlLibre-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Lora";src:url("brand/Lora-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
:root{
  --brand:#2362B4; --brand-hover:#1B4B89; --brand-soft:#E9F1FB; --brand-ring:rgba(35,98,180,.18);
  --scholars:#41C3FF; --scholars-soft:#E4F6FF; --scholars-ink:#0B4F6C;
  --dreamers:#79BE4D; --ok:#3F7A14; --ok-soft:#ECF6E2;
  --alumni:#EBB22A; --warn:#6E4E00; --warn-soft:#FBF1D8;
  --leaders:#E15546; --bad:#A8372A; --bad-soft:#FBE9E6;
  --navy:#16385C; --ink:#2B3C50; --muted:#6B7B8C; --faint:#9AA7B5;
  --line:#E4EAF1; --page:#F3F6FA; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --display:"Narkiss Block","Segoe UI",system-ui,sans-serif; --body:"Narkiss Block","Segoe UI",system-ui,sans-serif;
  --r:12px; --r-sm:8px; --shadow:0 12px 32px rgba(22,56,92,.14); --t:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;transition:var(--t)}
.card,.jc,.ctl,.heart,.sv,.iconbtn,.go,.tag,.pill{transition:var(--t)}
@media (prefers-reduced-motion:no-preference){
.menu,.pop{animation:drop .14s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
main.enter{animation:page .22s ease-out}@keyframes page{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.jc,.row,.event,.rrow{transition:var(--t),transform .15s ease}
@media (hover:hover){.jc:hover,.row:hover,.event:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,56,92,.07)}}
.sv.bump svg,.jacts .btn.bump svg{animation:pop .28s ease-out}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#toast{animation:rise .2s ease-out}@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(var(--to,1))}}
@keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
a{color:inherit;text-decoration:none}
b,strong{font-weight:500}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:flex;min-height:100vh}
moshal-sidebar{--surface:#16385C;--line:rgba(255,255,255,.12);--ink:#FFFFFF;--muted:rgba(255,255,255,.64);--brand:#FFFFFF;--brand-soft:rgba(255,255,255,.14);--page:rgba(255,255,255,.08);--navy:#0F2A47;--alumni:#EBB22A;--mark:#41C3FF}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
#chrome{position:sticky;top:0;z-index:20}
.topbar{height:0;background:none;border:0;box-shadow:none;display:flex;align-items:center;gap:16px;padding:0;max-width:1160px;width:100%;overflow:visible;position:relative;z-index:20}
.topbar .actions{position:absolute;top:26px;right:32px;display:flex;align-items:center;gap:8px;padding:3px;border-radius:999px;background:var(--page)}
.page-head{padding-right:104px}
.topbar .burger,.topbar .tlogo,.tabbar{display:none}
.tlogo{height:22px}
.scrim{position:fixed;inset:0;background:rgba(15,42,71,.45);z-index:65}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative;padding:0}
.iconbtn:hover,.iconbtn[aria-expanded="true"]{border-color:var(--brand);color:var(--brand)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:7px;right:8px;min-width:9px;height:9px;border-radius:999px;background:var(--alumni);border:2px solid var(--surface)}
.menuwrap{position:relative}
.me{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;padding:0 0 0 12px;margin-left:4px;border:0;border-left:1px solid var(--line);background:none;height:38px;border-radius:0}
.me:hover .avatar,.me[aria-expanded="true"] .avatar{box-shadow:0 0 0 3px var(--brand-ring)}
.me .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px}
.me .chev{width:12px;height:12px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;text-align:left;font-weight:400}
.menu .mh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu .mh button{border:0;background:none;color:var(--brand);font-weight:500;font-size:12px;padding:0;letter-spacing:0;text-transform:none}
.menu .mi{display:flex;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:8px;background:none;text-align:left;font:inherit;align-items:center}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.menu .mi .ri{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;flex:none;background:var(--surface-2);color:var(--muted)}
.menu .mi[aria-current="true"] .ri{background:var(--brand);color:#fff}
.menu .mi b{display:block;font-size:14px;color:var(--navy)}
.menu .mi span{display:block;font-size:12px;color:var(--muted)}
.menu .mi svg{width:16px;height:16px;color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:6px 8px}
.menu .ni{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;width:100%;border:0;background:none;text-align:left}
.menu .ni:hover{background:var(--surface-2)}
.menu .ni i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--line)}
.menu .ni.unread i{background:var(--alumni)}
.menu .ni p{margin:0;font-size:13px;line-height:1.4}
.menu .ni time{font-size:11px;color:var(--muted)}
.menu .empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:13px}
main{padding:32px 32px 72px;max-width:1160px;width:100%;container-type:inline-size}
h1{font-family:var(--display);font-size:28px;font-weight:500;color:var(--navy);margin:0;letter-spacing:-.2px;line-height:1.2}
h2{font-family:var(--display);font-size:19px;font-weight:500;color:var(--navy);margin:0 0 14px;letter-spacing:-.1px}
h3{font-family:var(--display);font-size:16px;font-weight:500;color:var(--navy);margin:0}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;position:relative;padding-top:14px}
.page-head::before{content:"";position:absolute;top:0;left:0;width:36px;height:4px;border-radius:2px;background:var(--brand)}

.page-head .n{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.page-head .lead{margin:4px 0 0;font-size:14px;color:var(--muted)}
.page-head .acts{display:flex;gap:8px;align-items:center;margin-left:auto}
.sub{color:var(--muted);font-size:14px;margin:-12px 0 22px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1B4B89,#2362B4 60%,#2F74C8);color:#fff;border-radius:16px;padding:28px 30px 30px;margin-bottom:24px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--scholars)}
/* The five sub-brand colours as one quiet rule: the brand's own device, nothing encoded. */
.hero h2{color:#fff;font-size:23px;margin:0 0 4px}
.hero p{margin:0 0 18px;color:#CFE2F7;font-size:14px}
.hero-search{display:flex;gap:12px;flex-wrap:wrap}
.hero-search .search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;height:48px;border-radius:var(--r-sm);padding:0 16px;background:#fff;position:relative}
.hero-search .ghost{position:absolute;left:43px;right:16px;top:0;height:100%;display:flex;align-items:center;font-size:15px;color:var(--muted);pointer-events:none;white-space:nowrap;overflow:hidden}
.hero-search .ghost:empty{display:none}
.hero-search .ghost i{display:inline-block;width:1.5px;height:18px;margin-left:2px;background:var(--brand);border-radius:1px;vertical-align:-3px}
@media (prefers-reduced-motion:no-preference){.hero-search .ghost i{animation:caret 1.1s steps(1) infinite}@keyframes caret{50%{opacity:0}}}
.hero-search .search svg{width:17px;height:17px;color:var(--muted)}
.hero-search input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:0}
.hero-search button{height:48px;padding:0 28px;border:0;border-radius:var(--r-sm);background:var(--navy);color:#fff;font-weight:500}
.hero-search button:hover{background:#0F2A47}
.hero-go{height:44px;padding:0 18px;border:0;border-radius:var(--r-sm);background:#fff;color:var(--brand);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.hero-go svg{width:16px;height:16px}
.jobs{display:flex;flex-direction:column;gap:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.jcards{display:flex;flex-direction:column;gap:10px}
.jc{display:grid;grid-template-columns:40px minmax(0,1fr) auto 32px;gap:14px;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
@media (hover:hover){.jc:hover{border-color:var(--brand)}}
.jc .open{display:contents;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.jc .av{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:500;letter-spacing:.02em}
.jc .t{min-width:0}
.jc .t b{display:block;font-size:15px;font-weight:500;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc .t span{display:block;font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc .w{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.jc .w.soon{color:var(--warn)}
.jc .w.done{color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.jc .w.done svg{width:14px;height:14px}
.sv{width:32px;height:32px;border:0;border-radius:6px;background:none;color:var(--faint);display:grid;place-items:center;padding:0;justify-self:end}
.sv:hover{background:var(--surface-2);color:var(--brand)}
.sv[aria-pressed="true"]{color:var(--brand)}
.sv[aria-pressed="true"] svg{fill:currentColor}
.sv svg{width:17px;height:17px}
.list .empty{padding:48px 20px}
.rlist{display:flex;flex-direction:column;gap:22px}
.rgroup h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:500}
.rrow{display:grid;grid-template-columns:56px minmax(0,1fr) 110px 24px;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--surface-2)}
.rrow b{display:block;font-size:15px;font-weight:500;color:var(--navy)}
.rrow:hover b{color:var(--brand)}
.rrow p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .m{font-size:13px;color:var(--muted);text-align:right}
.rrow .m.done{color:var(--ok)}
.rrow svg{width:16px;height:16px;color:var(--faint)}
.rrow .ok-ic{color:var(--ok)}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin:-12px 0 20px}
.progress i{display:block;flex:0 0 160px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress i b{display:block;height:100%;background:var(--dreamers)}
@container (max-width:640px){.rrow{grid-template-columns:56px minmax(0,1fr) 24px}.rrow .m{display:none}}
.job{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:0 16px;align-items:center;padding:14px 16px;width:100%;position:relative}
.job:hover{border-color:var(--brand)}
.job .open{display:contents;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.job .body{min-width:0}
.job h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .meta{color:var(--muted);font-size:13px;margin:2px 0 7px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.job .side{display:flex;align-items:center;gap:8px;justify-self:end}
.av{width:48px;height:48px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-family:var(--display);font-weight:500;font-size:16px;display:grid;place-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;white-space:nowrap}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.tag.applied{background:var(--ok-soft);color:var(--ok)}
.tag.saved{background:var(--brand-soft);color:var(--brand)}
.tag.muted{background:var(--surface-2);color:var(--muted)}
.tag svg{width:12px;height:12px}
.heart{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.heart:hover{border-color:var(--brand);color:var(--brand)}
.heart[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.heart svg{width:16px;height:16px}
.go{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;border:0;padding:0}
.go:hover{background:var(--brand);color:#fff}
.go svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:500;font-size:14px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.btn:hover{background:#DCEAFA}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--leaders);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{height:34px;padding:0 12px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.search-wide{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;height:38px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;background:var(--surface)}
.search-wide:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
.search-wide svg{width:16px;height:16px;color:var(--muted);flex:none}
.search-wide input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;outline:0}
.search-wide .clear{border:0;background:none;color:var(--muted);padding:0 2px;font-size:16px;line-height:1}
.ctl{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;position:relative}
.ctl:hover{border-color:var(--brand)}
.ctl[aria-expanded="true"],.ctl.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.ctl .chev{margin-left:2px;width:12px;height:12px;opacity:.7}
.ctl .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.pop{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;cursor:default;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;text-align:left;font-weight:400;color:var(--ink);cursor:default;max-height:360px;overflow:auto}
.pop.pop-right{left:auto;right:0}
.pop .h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pop .h button{border:0;background:none;color:var(--brand);font-size:12px;font-weight:500;padding:0;letter-spacing:0;text-transform:none}
.pop .o{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;font-size:14px;text-align:left}
.pop .o:hover{background:var(--surface-2)}
.pop .o[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:500}
.pop .o .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop .o .tick{width:14px;height:14px;flex:none;opacity:0}
.pop .o[aria-selected="true"] .tick{opacity:1}
.listbar{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.listbar .ctl{height:32px;padding:0 8px;border-color:transparent;background:none;font-size:13px;color:var(--navy)}
.listbar .ctl:hover{border-color:var(--line)}
.listbar .pop{left:auto;right:0}
.chipbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--muted);min-height:30px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--navy)}
.fchip button{width:18px;height:18px;border:0;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.fchip button:hover{background:var(--bad-soft);color:var(--bad)}
.chipbar .reset{border:0;background:none;color:var(--brand);font-weight:500;font-size:13px;padding:0}
.empty{padding:44px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--navy);font-size:16px;font-weight:500}
.notice{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--r-sm);font-size:14px;margin-bottom:18px}
.notice svg{width:16px;height:16px;flex:none}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--brand-soft);color:var(--navy)}
.jobwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@container (max-width:860px){.jobwrap{grid-template-columns:1fr}.jside{position:static}}
.detail{padding:28px}
.detail .tags{font-size:13px;color:var(--muted)}
.detail h1{font-size:26px;margin:8px 0 6px}
.detail .where{color:var(--muted);font-size:15px;margin:0 0 24px}

  const apps = pool.reduce((t, st) => t + appsInM(st, m.lo, m.hi).length, 0), offers = pool.reduce((t, st) => t + appsInM(st, m.lo, m.hi).filter(a => a.status === 'offer').length, 0);
  const listed = listedIn(m), listedPrev = pm ? listedIn(pm) : null, weekly = champsWeekly(m);
  const diff = (a, b) => b === null ? '' : ' · ' + (a - b >= 0 ? '▲ ' : '▼ ') + Math.abs(a - b) + ' on ' + pm.label.split(' ')[0];
  const lCols = monthCols(listedIn), weekly7 = A.grain === 'week';
  /* Weekly view: the twelve weeks up to the end of the chosen month. */
  const aCols = weekly7 ? Array.from({length:12}, (_, i) => { const lo = m.lo + (11 - i) * 7, hi = lo + 6, from = fmtD(isoAgo(hi)); return {label:from, short:from, tip:'Week of ' + from, n:pool.filter(st => activeIn(st, lo, hi)).length}; })
    : monthCols(x => pool.filter(st => activeIn(st, x.lo, x.hi)).length);
  const wkAvg = Math.round(sumArr(aCols.map(c => c.n)) / 12);
  const uniRows = REGIONS.filter(r => !A.region || r === A.region).map(reg => { const unis = INST.filter(([k]) => REGION_OF[k] === reg && (!A.uni || k === A.uni)).map(([k, nm]) => { const p = pool.filter(st => st.inst === k);
      return {k, nm, n:p.length, a:p.filter(st => activeIn(st, m.lo, m.hi)).length, ap:pm ? p.filter(st => activeIn(st, pm.lo, pm.hi)).length : 0, apps:p.reduce((t, st) => t + appsInM(st, m.lo, m.hi).length, 0), off:p.reduce((t, st) => t + appsInM(st, m.lo, m.hi).filter(a => a.status === 'offer').length, 0)}; });
    return {reg, unis, a:sumArr(unis.map(u => u.a)), ap:sumArr(unis.map(u => u.ap)), apps:sumArr(unis.map(u => u.apps)), off:sumArr(unis.map(u => u.off)), n:sumArr(unis.map(u => u.n))}; }).filter(r => r.unis.length);
  const chgCell = (a, b) => '<td class="num"><span class="chg ' + (a > b ? 'up' : a < b ? 'down' : '') + '">' + (a > b ? '▲ ' : a < b ? '▼ ' : '') + Math.abs(a - b) + '</span></td>';
  const row = (cls, name, x) => '<tr class="' + cls + '"><td>' + name + '</td><td class="num">' + x.a + ' <span class="sm">of ' + x.n + '</span></td>' + (pm ? chgCell(x.a, x.ap) : '<td></td>') + '<td class="num">' + x.apps + '</td><td class="num">' + x.off + '</td></tr>';
  return aWrap('programme', '<div class="page-head"><h1>Programme dashboard</h1><button class="btn btn-ghost btn-sm" onclick="S.dlg={kind:\'targets\'};render()">Targets</button><button class="iconbtn" title="Download this month" aria-label="Download CSV" onclick="progCsv()">' + RICO.download + '</button></div>' +
    aFilters({month:true, region:true, scholarFields:true}) +
    '<div class="kts">' +
      aTile('Listings posted', listed, 'target ' + TARGETS.listings + diff(listed, listedPrev), pct(listed, TARGETS.listings)) +
      aTile('Active scholars', act, 'target ' + TARGETS.active + diff(act, actPrev), pct(act, TARGETS.active)) +
      aTile('Champions posting every week', weekly, 'of ' + CHAMP_NAMES.length + ' champions', pct(weekly, CHAMP_NAMES.length)) +
      aTile('Applications', apps, offers + ' offers') + '</div>' +
    '<div class="dg">' + barTrend('Listings posted each month', 'pl', lCols, TARGETS.listings, 'target ' + TARGETS.listings, '<b>' + listed + '</b> in ' + m.label + ' · target ' + TARGETS.listings) +
      barTrend('Active scholars each ' + (weekly7 ? 'week' : 'month'), 'pa', aCols, weekly7 ? wkAvg : TARGETS.active, weekly7 ? 'average ' + wkAvg : 'target ' + TARGETS.active,
        (weekly7 ? '<b>' + aCols[11].n + '</b> in the week of ' + aCols[11].short : '<b>' + act + '</b> in ' + m.label) + ' · signed in or applied' + (A.uni ? ' · ' + A.uni : '')).replace('</h2>', '</h2>' + aSeg('grain', [['month', 'Monthly'], ['week', 'Weekly']])) + '</div>' +
    '<section class="card"><div class="card-head"><h2>By region and university</h2></div>' + take(m.label + (pm ? ', with the change on ' + pm.label.split(' ')[0] : '')) +
      '<div class="tablewrap"><table class="rt prog"><thead><tr><th>Where</th><th class="num">Active scholars</th><th class="num">Change</th><th class="num">Applications</th><th class="num">Offers</th></tr></thead><tbody>' +
      uniRows.map(r => row('reg', '<b>' + r.reg + '</b>', r) + r.unis.map(u => row('', '<span class="ind">' + u.nm + '</span>', u)).join('')).join('') + '</tbody></table></div></section>' +
    '<section class="card mailcard"><div class="ml"><b>Email this summary every month</b><span>On the 1st, to careers@moshal.org: the four numbers above and the table by region.</span></div>' +
      '<label class="switch"><input type="checkbox"' + (TARGETS.email ? ' checked' : '') + ' onchange="setMonthlyEmail(this.checked)" aria-label="Email the monthly summary"><i></i></label>' +
      '<button class="btn btn-ghost btn-sm" onclick="sendSummaryNow()">' + ICO.send + 'Send ' + m.label.split(' ')[0] + ' now</button></section>');
};
/* Months are counted back from the prototype's today; the current month runs to today. Data reaches back 365 days. */
const MONTHS_BACK = () => { const t = new Date(TODAY_ISO + 'T12:00:00'), out = [];
  for (let i = 0; i < 12; i++) { const a = new Date(t.getFullYear(), t.getMonth() - i, 1, 12), b = i ? new Date(t.getFullYear(), t.getMonth() - i + 1, 0, 12) : t;
    out.push({lo:Math.round((t - b) / 864e5), hi:Math.round((t - a) / 864e5), key:a.getFullYear() + '-' + String(a.getMonth() + 1).padStart(2, '0'), label:a.toLocaleDateString('en-ZA', {month:'long', year:'numeric'}) + (i ? '' : ' (so far)')}); }
  return out; };
const monthRows = m => STU.map(st => { const inM = st.apps.filter(a => a.d >= m.lo && a.d <= m.hi), before = st.apps.some(a => a.d > m.hi);
  return {st, apps:inM.length, interviews:inM.filter(a => a.status === 'interview').length, offers:inM.filter(a => a.status === 'offer').length, signed:inM.length > 0 || (st.login !== null && st.login >= m.lo && st.login <= m.hi),
    status:inM.length ? 'Applied' : before ? 'Stopped applying' : 'Never applied'}; });
const monthSummary = rows => ({signed:rows.filter(r => r.signed).length, applied:rows.filter(r => r.apps).length, apps:rows.reduce((t, r) => t + r.apps, 0), interviews:rows.reduce((t, r) => t + r.interviews, 0), offers:rows.reduce((t, r) => t + r.offers, 0)});
function openMonthly(){ S.dlg = {kind:'monthly', m:1, shape:'scholar'}; render(); }
const monthFile = m => 'moshal-scholar-activity-' + m.key + (S.dlg && S.dlg.shape === 'uni' ? '-by-university' : '') + '.csv';
function exportMonth(){
  const m = MONTHS_BACK()[S.dlg.m], rows = monthRows(m), q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const out = S.dlg.shape === 'uni'
    ? [['University', 'Scholars', 'Signed in', 'Applied', 'Applications', 'Interviews', 'Offers', 'Stopped applying', 'Never applied']].concat(INST.map(([k, name]) => { const r = rows.filter(x => x.st.inst === k), s = monthSummary(r);
      return [name, r.length, s.signed, s.applied, s.apps, s.interviews, s.offers, r.filter(x => x.status === 'Stopped applying').length, r.filter(x => x.status === 'Never applied').length]; }))
    : [['Scholar', 'University', 'Faculty', 'Year of study', 'Graduating', 'Signed in this month', 'Status this month', 'Applications', 'Interviews', 'Offers']].concat(rows.map(r => [r.st.name, r.st.instName, r.st.fac, r.st.year, r.st.grad, r.signed ? 'Yes' : 'No', r.status, r.apps, r.interviews, r.offers]));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv'})); a.download = monthFile(m); a.click();
  closeDlg(); toast('Exported ' + m.label.replace(' (so far)', '') + '.');
}
V.admin = () => {
  const pool = scoped(), key = chartKey(), still = key === R.chartKey && S.lastView === 'admin';
  R.chartKey = key;
  if (!still) setTimeout(countUp, 0);
  return '<div class="rp' + (still ? ' still' : '') + '"><div class="page-head"><h1>Scholar report</h1><button class="btn btn-ghost btn-sm monthbtn" onclick="openMonthly()">' + ICO.cal + 'Monthly report</button><button class="iconbtn" title="Export · ' + groupList(pool).length + ' scholars" aria-label="Export" onclick="openExport(R.seg)"' + (pool.length ? '' : ' disabled') + '>' + RICO.download + '</button></div>' +
    toolbar() + storyLine(pool) + kpis(pool) +
    '<div class="dg">' + trendPanel(pool) + funnelPanel(pool) + '</div>' +
    '<div class="dg">' + placePanel(pool) + fieldPanel(pool) + '</div>' +
    '<div class="dg">' + finalPanel() + yearPanel() + '</div>' +
    (R.showNames ? namesPanel(pool) : namesGate(pool)) + '</div>';
};
const namesGate = pool => '<section class="card names gate"><div class="card-head"><h2>Names</h2></div>' + take('<b>' + groupList(pool).length + ' scholars</b> in this selection. The report shows totals; open the names only when you need to contact someone.') +
  '<div class="gatebtn"><button class="btn btn-ghost btn-sm" onclick="R.showNames=true;render();setTimeout(scrollNames,0)">' + ICO.user + 'Show names</button></div></section>';

const sb = document.getElementById('sb');
sb.addEventListener('navigate', e => nav(e.detail.key));
const PAGE_ROLE = {submit:'champion', subs:'champion', queue:'admin', admin:'admin', postres:'admin', postevent:'admin', console:'admin', users:'admin', insights:'admin', programme:'admin', content:'admin', log:'admin'};
const title = (t, n) => '<div class="page-head' + (PAGE_ROLE[S.view] !== undefined ? (PAGE_ROLE[S.view] ? ' r-' + PAGE_ROLE[S.view] : '') : ' r-scholar') + '"><h1>' + t + '</h1>' + (n ? '<span class="n">' + n + '</span>' : '') + '</div>';
document.addEventListener('click', () => { if (S.open) { S.open = null; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.dlg && S.dlg.kind === 'sf') return; if (S.dlg) { S.dlg = null; render(); } else if (S.open) { S.open = null; render(); } else if (S.navOpen) { S.navOpen = false; render(); } return; }
});
syncNav();
render();
</script>
